    }
    .g-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }
    .fb-theme {
      background: #f0f2f5;
    }
    .fb-input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      font-size: 16px;
      color: #1c1e21;
      outline: none;

    .fb-input:focus {
      border-color: #1877f2;
      box-shadow: 0 0 0 2px #e7f3ff;
